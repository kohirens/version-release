description: Publish an image to Docker Hub.

parameters:
    attach_workspace_path:
        default: "."
        description: Set where to attach the workspace.
        type: string
    build_context:
        default: "."
        description: Set where to attach the workspace.
        type: string
    build_args:
        default: ""
        description: Build arguments, for example --build-arg "foo".
        type: string
    do_attach_workspace:
        default: false
        description: |2
          Set this to `true` to attaching the workspace or false to skip this
          step. If you do set this to false, then you may want to set
          `do_checkout` to true.
        type: boolean
    do_checkout:
        default: true
        description: |
          Set this to true to perform a checkout step, or false to skip.
          If you do set this to false, then you may want to set
          `do_attach_workspace` to true.
        type: boolean
    docker_buildkit:
        default: "1"
        description: Set the Docker environment variable DOCKER_BUILDKIT
        type: string
    dockerfile:
        default: "Dockerfile"
        description: Path to the Docker environment variable DOCKER_BUILDKIT
        type: string
    env_file:
        default: ""
        description: Environment file containing variable value pairs to export to the build environment.
        type: string
    repository:
        description: |2
          Docker Hub image repository for example "kohirens/version-release".
        type: string
    semver_tag:
        default: ""
        description: The semantic version, will override all other settings.
        type: string
    semver_tag_cmd:
        default: ""
        description: Command to run to get the semantic version, will override the auto generated value.
        type: string
    semver_tag_env_var:
        default: ""
        description: Environment variable to get the semantic version, will override the auto generated value.
        type: string
    semver_tag_file:
        default: ""
        description: File to get the semantic version, it must be on the first line of the file. It will override the auto generated value.
        type: string
    tags:
        default: ""
        description: A space separated list of additional tags that will be applied to the image pushed to Docker Hub. The semantic version will automatically be prefixed to this list.
        type: string
    target:
        default: ""
        description: |2
          Set the build target,
          see https://docs.docker.com/engine/reference/commandline/build/#target
        type: string

executor: cimg-base

environment:
    BUILD_ARGS: << parameters.build_args >>
    BUILD_CONTEXT: << parameters.build_context >>
    DOCKER_BUILDKIT: << parameters.docker_buildkit >>
    DOCKER_FILE: << parameters.dockerfile >>
    ENV_FILE: << parameters.env_file >>
    SEMVER_TAG: << parameters.semver_tag >>
    SEMVER_TAG_CMD: << parameters.semver_tag_cmd >>
    SEMVER_TAG_ENV_VAR: << parameters.semver_tag_env_var >>
    SEMVER_TAG_FILE: << parameters.semver_tag_file >>
    TAGS: << parameters.tags >>
    REPOSITORY: << parameters.repository >>
    TARGET: << parameters.target >>

steps:
    - when:
          condition: << parameters.do_checkout >>
          steps:
              - checkout
    - when:
          condition: << parameters.do_attach_workspace >>
          steps:
              - attach_workspace:
                    at: << parameters.attach_workspace_path >>
    - setup_remote_docker
    - run:
        name: Push Docker image
        command: << include(scripts/publish-docker-hub.sh) >>
